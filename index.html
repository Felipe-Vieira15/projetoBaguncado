<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja Bagunçada - Início</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="loading-overlay" class="loading-overlay hidden">
      <div class="spinner"></div>
    </div>

    <div id="toast-container"></div>

    <div id="confirm-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3>Atenção!</h3>
        <p id="confirm-message">Tem certeza que deseja fazer isso?</p>
        <div class="modal-botoes">
          <button id="modal-btn-cancelar" class="modal-btn modal-btn-cancelar">
            Cancelar
          </button>
          <button id="modal-btn-confirmar" class="modal-btn modal-btn-confirmar">
            Confirmar
          </button>
        </div>
      </div>
    </div>

    <header>
      <div class="container">
        <img src="assets/logo.png" id="logo" alt="Logo Loja Bagunçada" />
        <nav>
          <ul>
            <li><a href="index.html" class="active">Início</a></li>
            <li><a href="contato.html">Contato</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="coluna">
        <h1>Produtos</h1>
        <div id="lista-produtos"></div>
      </section>

      <section class="coluna">
        <h1>Formulário</h1>
        <form id="form-produto" method="post">
          <input type="hidden" id="produto-id" name="id" />

          <label for="nome">Nome:</label>
          <input type="text" id="nome" name="nome" required />

          <label for="preco">Preço (R$):</label>
          <input type="number" id="preco" name="preco" step="0.01" required />

          <button type="submit">Salvar</button>
          <button type="reset" id="btn-cancelar" class="hidden">
            Cancelar Edição
          </button>
        </form>
      </section>
    </main>

    <footer>
      <p>© Loja Bagunçada</p>
    </footer>

    <script src="js/main.js" defer></script>
  </body>
</html>
